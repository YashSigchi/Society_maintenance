version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: societyhub_db
    environment:
      POSTGRES_USER: societyhub_user
      POSTGRES_PASSWORD: societyhub_password
      POSTGRES_DB: societyhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
